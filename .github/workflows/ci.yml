name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "${SDKMANAGER:-}" ]; then
            echo "sdkmanager not found under ${SDK_ROOT}/cmdline-tools" >&2
            exit 1
          fi
          {
            echo "ANDROID_HOME=${SDK_ROOT}"
            echo "ANDROID_SDK_ROOT=${SDK_ROOT}"
          } >> "${GITHUB_ENV}"
          echo "$(dirname "${SDKMANAGER}")" >> "${GITHUB_PATH}"
          yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test Android Debug APK
        run: ./gradlew check assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  pc-studio:
    name: OpenCam Studio Tests
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pc-client-native
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pc-client-native/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run wire-protocol regression suite
        run: npm test
