name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencam-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  windows-client:
    name: Windows client exe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: windows-client
        run: python -m pip install pyinstaller pillow pyvirtualcam numpy

      - name: Build standalone exe
        working-directory: windows-client
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name OpenCamClient --add-data "vcam;vcam" opencam_client.py

      - name: Self-test the exe against the mock phone
        working-directory: windows-client
        run: .\dist\OpenCamClient.exe --selftest

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencam-windows-exe
          path: windows-client/dist/OpenCamClient.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [android, windows-client]
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: opencam-apk
          path: artifacts/apk

      - name: Download Windows exe
        uses: actions/download-artifact@v4
        with:
          name: opencam-windows-exe
          path: artifacts/exe

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/apk/*.apk
            artifacts/exe/OpenCamClient.exe
          generate_release_notes: true
