name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore or generate release signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "Using configured GitHub repository signing secrets..."
            echo "::add-mask::${KEYSTORE_PASSWORD}"
            echo "::add-mask::${KEY_ALIAS}"
            echo "::add-mask::${KEY_PASSWORD}"
            umask 077
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > keystore/opencam-release.jks
            {
              printf 'storeFile=%s\n' 'keystore/opencam-release.jks'
              printf 'storePassword=%s\n' "${KEYSTORE_PASSWORD}"
              printf 'keyAlias=%s\n' "${KEY_ALIAS}"
              printf 'keyPassword=%s\n' "${KEY_PASSWORD}"
            } > keystore.properties
          else
            echo "No custom signing secrets configured; generating release signing key..."
            keytool -genkeypair -v -keystore keystore/opencam-release.jks -alias opencam -keyalg RSA -keysize 2048 -validity 10000 -storepass opencam123 -keypass opencam123 -dname "CN=OpenCam, OU=OpenCam, O=OpenCam, L=OpenCam, ST=OpenCam, C=US"
            {
              printf 'storeFile=%s\n' 'keystore/opencam-release.jks'
              printf 'storePassword=%s\n' 'opencam123'
              printf 'keyAlias=%s\n' 'opencam'
              printf 'keyPassword=%s\n' 'opencam123'
            } > keystore.properties
          fi

      - name: Build release APK
        run: ./gradlew :app:clean :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and rename APK
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -f "${APK}"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}"
          cp "${APK}" "opencam-${GITHUB_REF_NAME}-release.apk"

      - name: Generate release notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## OpenCam ${TAG}"
            echo
            echo "Signed release APK built and verified by GitHub Actions."
            echo
            echo "### Changes"
            echo
            if [ -n "${PREV}" ]; then
              git log --pretty=format:'- %s' "${PREV}..${TAG}"
            else
              git log --pretty=format:'- %s' "${TAG}"
            fi
          } > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: opencam-*.apk
          name: OpenCam ${{ github.ref_name }}
          body_path: release-notes.md
