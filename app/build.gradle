plugins {
    id 'com.android.application'
}

android {
    namespace 'io.opencam.webcam'
    compileSdk 34

    defaultConfig {
        applicationId "io.opencam.webcam"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        // Pure Java 8 source, no desugaring required (framework-only APIs).
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        // Shared distribution key (committed on purpose) so local builds and GitHub
        // Actions produce the same signature — sideload upgrades stay seamless.
        // NOTE: a committed keystore means anyone can sign as OpenCam. Replace it
        // (and set OPENCAM_STORE_PASS / OPENCAM_KEY_PASS) before any real release.
        release {
            storeFile file('../signing/opencam-release.keystore')
            storePassword System.getenv('OPENCAM_STORE_PASS') ?: 'opencam-signing-key'
            keyAlias 'opencam'
            keyPassword System.getenv('OPENCAM_KEY_PASS') ?: 'opencam-signing-key'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
