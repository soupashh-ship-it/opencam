plugins {
    id 'com.android.application'
}

android {
    namespace 'io.opencam.webcam'
    compileSdk 34

    defaultConfig {
        applicationId "io.opencam.webcam"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        // Pure Java 8 source, no desugaring required (framework-only APIs).
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        // Shared distribution key (committed on purpose) so local builds and GitHub
        // Actions produce the same signature — sideload upgrades stay seamless.
        // Replace with your own keystore before publishing to any app store.
        release {
            storeFile file('../signing/opencam-release.keystore')
            storePassword 'opencam-signing-key'
            keyAlias 'opencam'
            keyPassword 'opencam-signing-key'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
