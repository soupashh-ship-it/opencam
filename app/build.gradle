plugins {
    id 'com.android.application'
}

android {
    namespace 'io.opencam.webcam'
    compileSdk 34

    defaultConfig {
        applicationId "io.opencam.webcam"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        // Pure Java 8 source, no desugaring required (framework-only APIs).
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
