<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCam Remote</title>
<style>
  :root { --bg:#101418; --card:#1b232b; --accent:#00c4ff; --text:#e8eef2; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--card); }
  h1 { font-size:18px; margin:0; }
  #battery { color:var(--accent); }
  main { padding:12px 16px; max-width:900px; margin:0 auto; }
  #preview { width:100%; background:#000; border-radius:8px; aspect-ratio:16/9; object-fit:contain; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; align-items:center; }
  button, select, input[type=range] { padding:8px 12px; border-radius:6px; border:1px solid #333c46; background:var(--card); color:var(--text); font-size:14px; }
  button:hover { border-color:var(--accent); cursor:pointer; }
  button.primary { background:var(--accent); color:#001014; font-weight:600; }
  .label { font-size:13px; color:#9aa7b4; min-width:60px; }
  #msg { margin-top:12px; min-height:1.2em; font-size:13px; color:#9aa7b4; }
</style>
</head>
<body>
<header>
  <h1>OpenCam</h1>
  <span id="battery">…</span>
</header>
<main>
  <img id="preview" src="/video" alt="live">
  <div class="row">
    <button class="primary" id="btn-stop">Stop streaming</button>
    <button id="btn-restart">Restart</button>
    <button id="btn-torch">Torch</button>
    <button id="btn-mic">Mute mic</button>
    <button id="btn-cam">Switch camera</button>
  </div>
  <div class="row">
    <span class="label">Zoom</span>
    <input type="range" id="zoom" min="1" max="8" step="0.1" value="1">
  </div>
  <div class="row">
    <span class="label">White balance</span>
    <select id="wb">
      <option value="-1">Auto</option>
      <option value="1">Incandescent</option>
      <option value="2">Fluorescent warm</option>
      <option value="3">Twilight</option>
      <option value="4">Fluorescent</option>
      <option value="5">Daylight</option>
      <option value="6">Cloudy</option>
      <option value="7">Shade</option>
      <option value="8">Manual</option>
    </select>
  </div>
  <div id="msg"></div>
</main>
<script>
function put(url) {
  return fetch(url, {method:'PUT'}).then(r => r.text()).catch(e => { msg('request failed: ' + e); });
}
function msg(t) { document.getElementById('msg').textContent = t; }

let activeCam = 0;
let camCount = 2;

document.getElementById('btn-stop').onclick = () => put('/v1/stop').then(() => location.reload());
document.getElementById('btn-restart').onclick = () => put('/v1/restart');
document.getElementById('btn-torch').onclick = () => put('/v1/camera/torch_toggle');
document.getElementById('btn-mic').onclick = () => put('/v1/camera/mic_toggle');
document.getElementById('btn-cam').onclick = () => {
  let nextCam = (activeCam + 1) % camCount;
  put('/v1/camera/active/' + nextCam).then(() => { activeCam = nextCam; });
};

document.getElementById('zoom').addEventListener('change', e =>
  put('/v3/camera/zoom/' + e.target.value));

document.getElementById('wb').addEventListener('change', e =>
  put('/v1/camera/wb_mode/' + e.target.value));

function refreshInfo() {
  fetch('/v1/phone/battery_info').then(r => r.json()).then(j => {
    document.getElementById('battery').textContent = 'Battery ' + j.level + '%';
  }).catch(() => {});
  fetch('/v1/camera/info').then(r => r.json()).then(j => {
    activeCam = j.active || 0;
    if (j.zmMax && j.zmMax > 1) {
      document.getElementById('zoom').max = j.zmMax;
    }
  }).catch(() => {});
  fetch('/v1/camera/camera_list').then(r => r.text()).then(t => {
    let lines = t.trim().split('\n').filter(Boolean);
    if (lines.length > 0) camCount = lines.length;
  }).catch(() => {});
}
setInterval(refreshInfo, 10000);
refreshInfo();
</script>
</body>
</html>
